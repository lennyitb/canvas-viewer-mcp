# canvas-viewer-mcp
#
# Binds to localhost only. Your public hostname is served by a reverse proxy,
# which terminates TLS and forwards here; publishing this port on 0.0.0.0 would
# expose the MCP endpoint without that TLS layer.
#
# Every deployment-specific value comes from .env -- see DEPLOY.md. Nothing in
# this file is specific to one school or one domain.

services:
  canvas-viewer-mcp:
    image: ghcr.io/lennyitb/canvas-viewer-mcp:latest
    # Or build locally:  docker compose build
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CANVAS_BASE_URL: ${CANVAS_BASE_URL:?set CANVAS_BASE_URL in .env, e.g. https://yourschool.instructure.com}
      # The public HTTPS URL Claude reaches this server on. Getting this wrong
      # points the connector's OAuth flow at whatever host it names.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env, e.g. https://canvas-viewer-mcp.example.com}
      # The connector login, three ways, in this order of precedence.
      # Set none of them and the server issues itself a pairing code on first
      # run and prints it once to `docker compose logs`.
      #
      #   AUTH_PASSWORD_HASH  an argon2 hash from `canvas-probe hash-password`;
      #                       the plaintext is never stored anywhere.
      #   AUTH_PASSWORD       a plaintext password, hashed at startup. Simpler,
      #                       and it sits in .env beside nothing worse than the
      #                       Canvas token path.
      #
      # Setting either one deletes a pairing code already issued, which is how
      # a code that reached a log aggregator gets revoked.
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
    secrets:
      - canvas_token
    volumes:
      # OAuth state. Drop this and every redeploy deauthorizes the connector.
      - canvas-viewer-mcp-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

secrets:
  canvas_token:
    # Mounted at /run/secrets/canvas_token; the value never enters an
    # environment variable, the process list, or an image layer.
    file: ${CANVAS_TOKEN_FILE:-./secrets/canvas_token}

volumes:
  canvas-viewer-mcp-data:
